name: Repository scripts

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'rom/**'
      - '.github/workflows/scripts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'rom/**'
      - '.github/workflows/scripts.yml'
  workflow_dispatch:

concurrency:
  group: scripts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint
        run: shellcheck -x scripts/appstore-* scripts/lib/*.sh tests/run-tests.sh tests/fixtures/generate.sh rom/import-prebuilt.sh

      # Runs unprivileged, which is the point: the suite writes an nginx config
      # and runs `nginx -t` over it, and anything the generated config needs
      # root for is a bug in the generated config.
      - name: End-to-end self-test
        run: tests/run-tests.sh
