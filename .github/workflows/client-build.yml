name: Build client

# Work lands through pull requests, so the PR is where checks belong. Push is
# scoped to main for the post-merge run; without that scoping every PR would
# run twice, once for the branch push and once for the PR.
on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client-build.yml'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/client-build.yml'
  workflow_dispatch:

concurrency:
  group: client-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Two seconds here beats a minute and a half of Gradle. A malformed
      # resource fails deep inside aapt2 with a message that does not say what
      # is wrong with the file; this says it plainly. A '--' inside an XML
      # comment is the way this has actually gone wrong before.
      - name: Check XML resources are well-formed
        run: |
          python3 - <<'PY'
          import glob, sys, xml.dom.minidom as minidom
          bad = 0
          files = glob.glob("client/app/src/main/**/*.xml", recursive=True)
          for path in files:
              try:
                  minidom.parse(path)
              except Exception as exc:
                  print("::error file=%s::%s" % (path, exc))
                  bad += 1
          print("checked %d XML resources, %d malformed" % (len(files), bad))
          sys.exit(1 if bad else 0)
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      # The build refuses to fall back to a placeholder repository, so CI has to
      # supply a throwaway one. This config can only ever talk to a domain that
      # cannot resolve, and its key exists for the length of this job.
      - name: Generate throwaway repository config
        run: |
          set -eu
          openssl genpkey -algorithm ed25519 -out ci-key.pem
          pub=$( { printf 'Ed'; openssl rand 8; \
                   openssl pkey -in ci-key.pem -pubout -outform DER | tail -c 32; } | base64 -w0 )
          rm -f ci-key.pem
          cat > client/repo.properties <<EOF
          REPO_BASE_URL=https://apps.invalid
          REPO_PUBLIC_KEY=$pub
          REPO_KEY_VERSION=0
          REPO_ACCESS_KEY_HEADER=X-AppStore-Key
          REPO_ACCESS_KEY=ci-build-only
          EOF

      - name: Build with Gradle
        working-directory: client
        run: ./gradlew build --no-daemon
