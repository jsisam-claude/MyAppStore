name: Validate Gradle Wrapper

# Only when the wrapper itself changes. Validating an unchanged jar on every
# push to any file is the definition of a wasted run.
on:
  push:
    paths:
      - 'client/gradle/wrapper/**'
      - 'client/gradlew'
      - 'client/gradlew.bat'
      - '.github/workflows/validate-gradle-wrapper.yml'
  workflow_dispatch:

concurrency:
  group: gradle-wrapper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          allow-snapshots: false
